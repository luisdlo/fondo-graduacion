# H2 en archivo: la base vive en ~/fondo-graduacion-db/fondo.mv.db
spring.datasource.url=jdbc:h2:file:~/fondo-graduacion-db/fondo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Corre schema.sql en cada arranque (no borra ni duplica)
spring.sql.init.mode=always

# Consola H2: http://localhost:8080/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Fechas en español
spring.web.locale=es_MX
spring.web.locale-resolver=fixed

# Ver cambios en las plantillas sin reiniciar
spring.thymeleaf.cache=false

# Comprobantes (PDF o foto)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB