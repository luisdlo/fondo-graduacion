<!-- Pestaña Consulta (pedazo que HTMX pone en #panel) -->
<div class="card hero">
  <h2>Fondo de graduación · disponible</h2>
  <div class="big"><span th:replace="~{fragments :: money(${general.totalGeneral})}"></span></div>
  <div class="stats">
    <div class="stat"><div class="k">Total de los grupos</div>
      <div class="v pos"><span th:replace="~{fragments :: money(${general.totalGrupos})}"></span></div></div>
    <div class="stat"><div class="k">Total de eventos</div>
      <div class="v pos"><span th:replace="~{fragments :: money(${general.totalEventos})}"></span></div></div>
  </div>
</div>

<div class="grid mt">
  <!-- Solo con sesión la tarjeta lleva a Movimientos (si no, th:hx-get queda en null y no se pinta) -->
  <div class="card" th:each="g : ${grupos}"
       th:classappend="${logueado} ? 'card-link'"
       th:hx-get="${logueado} ? @{/movimientos(grupo=${g.grupoId}, cancelados=true)}"
       hx-target="#panel"
       th:title="${logueado} ? |Ver movimientos del ${g.nombre}|"
       onclick="document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x.textContent.trim() === 'Movimientos'));">
    <div class="row" style="padding:0 0 8px">
      <span class="pill" th:classappend="${'g-' + g.grupoId}" th:text="${g.nombre}">Grupo A</span>
      <span class="muted" th:text="|Vocal: ${g.vocal}|">Vocal</span>
    </div>
    <div class="row"><span class="muted">Ingresos</span>
      <span class="pos"><span th:replace="~{fragments :: money(${g.ingresos})}"></span></span></div>
    <div class="row"><span class="muted">Gastos del grupo</span>
      <span class="neg"><span th:replace="~{fragments :: money(${g.gastos})}"></span></span></div>
    <div class="row"><strong>Aporta al fondo</strong>
      <strong><span th:replace="~{fragments :: money(${g.total})}"></span></strong></div>
    <div class="go" th:if="${logueado}">Ver movimientos →</div>
  </div>
  <!-- Bolsa de Eventos: es de los tres grupos. Misma tarjeta que los grupos, al final, con un renglón chico por evento. -->
  <div class="card"
       th:with="ing=${#aggregates.sum(eventos.![ingresos])}, gas=${#aggregates.sum(eventos.![gastos])}"
       th:classappend="${logueado} ? 'card-link'"
       th:hx-get="${logueado} ? @{/movimientos(grupo='EVENTOS', cancelados=true)}"
       hx-target="#panel"
       th:title="${logueado} ? 'Ver movimientos de eventos'"
       onclick="document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x.textContent.trim() === 'Movimientos'));">
    <div class="row" style="padding:0 0 8px">
      <span class="pill g-EVENTO">Eventos</span>
      <span class="muted">De los 3 grupos</span>
    </div>
    <div class="row"><span class="muted">Ingresos</span>
      <span class="pos"><span th:replace="~{fragments :: money(${ing ?: 0})}"></span></span></div>
    <div class="row"><span class="muted">Gastos</span>
      <span class="neg"><span th:replace="~{fragments :: money(${gas ?: 0})}"></span></span></div>
    <div class="row"><strong>Aporta al fondo</strong>
      <strong><span th:replace="~{fragments :: money(${general.totalEventos})}"></span></strong></div>
    <div class="evs" th:unless="${eventos.isEmpty()}">
      <div class="row" th:each="e : ${eventos}">
        <span th:text="${e.evento}">Halloween</span>
        <span th:replace="~{fragments :: money(${e.total})}"></span>
      </div>
    </div>
    <div class="go" th:if="${logueado}">Ver movimientos →</div>
  </div>
</div>
