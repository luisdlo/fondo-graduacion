<!-- Pedazos reutilizables -->

<!-- Monto con formato $1,000 -->
<span th:fragment="money(v)" th:text="${'$' + #numbers.formatDecimal(v, 1, 'COMMA', 0, 'POINT')}">$0</span>

<!-- Un movimiento de la lista. Si el vocal puede cancelarlo, el <li> se vuelve clickable
     y muestra un formulario inline con el motivo. -->
<li th:fragment="mov(m, vocal)" class="mov"
    th:with="puedeCancelar=${vocal != null and !m.cancelado
              and ((m.grupoId != null and m.grupoId == vocal.grupoId)
                or (m.grupoId == null and m.registradoPor == vocal.nombre))}"
    th:classappend="${(m.esIngreso() ? 'ingreso' : 'egreso')
              + (m.cancelado ? ' is-cancel' : '')
              + (puedeCancelar ? ' mov-clickable' : '')}"
    th:attr="data-cancelable=${puedeCancelar}"
    onclick="if(this.dataset.cancelable==='true' &amp;&amp; !event.target.closest('a,button,input,form,label,textarea')) this.classList.toggle('open')">
  <span class="pill" th:classappend="${m.pillClass()}" th:text="${m.grupoEtiqueta()}">Grupo A</span>
  <div class="mov-main">
    <div class="mov-title" th:text="${m.concepto}">Fondo de graduación</div>
    <div class="meta">
      <span th:text="${#temporals.format(m.fecha, 'd MMM yyyy')}">1 sep 2026</span>
      <span th:unless="${m.esIngreso()}"> · Fondo de graduación</span>
      <span th:if="${m.nino != null}" th:text="|· Niño: ${m.nino}|"></span>
      <span th:text="|· Registró: ${m.registradoPor}|"></span>
    </div>
    <div class="meta" th:unless="${m.esIngreso()}">
      <a th:if="${m.comprobante != null}" th:href="@{/comprobantes/{n}(n=${m.comprobante})}" target="_blank" th:text="|📎 ${m.comprobante}|"></a>
      <span th:if="${m.comprobante == null}" class="warn">Sin comprobante</span>
    </div>
    <div class="cancelado" th:if="${m.cancelado}"
         th:text="|Cancelado por ${m.canceladoPor}: ${m.motivoCancelacion}|"></div>
  </div>
  <div class="mov-side">
    <div class="monto"><span th:text="${m.esIngreso() ? '+' : '−'}">+</span><span th:replace="~{fragments :: money(${m.monto})}"></span></div>
  </div>

  <!-- Formulario inline para cancelar (solo si el vocal es el dueño del movimiento) -->
  <div class="mov-cancel" th:if="${puedeCancelar}">
    <form th:action="@{/registro/cancelar/{id}(id=${m.id})}" method="post">
      <label class="field">Motivo de la cancelación
        <input name="motivo" required maxlength="255" placeholder="Ej. Se registró dos veces">
      </label>
      <div class="form-actions">
        <button type="button" class="btn" onclick="this.closest('li').classList.remove('open')">Cerrar</button>
        <button class="btn out">Cancelar movimiento</button>
      </div>
    </form>
  </div>
</li>
