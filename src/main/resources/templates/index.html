<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fondo de Graduación</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Fondo de Graduación</h1>
      <p class="sub">Lo que juntan los tres grupos para la graduación y en qué se gasta, visible para todos.</p>
    </div>

    <!-- Sesión: si hay vocal logueado se muestra quién es; si no, el botón para entrar -->
    <div class="user" th:if="${vocal != null}">
      <span><strong th:text="${vocal.nombre}">Vocal</strong> · <span th:text="${vocal.grupoNombre}">Grupo</span></span>
      <button class="btn" hx-get="/registro/cambiar-password" hx-target="#modal-body" onclick="abrirModal()">🔒 Cambiar contraseña</button>
      <form th:action="@{/logout}" method="post"><button class="link">Salir</button></form>
    </div>
    <a class="btn" th:if="${vocal == null}" th:href="@{/login}">Entrar (vocales)</a>
  </header>

  <div class="alert ok" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert error" th:if="${error}" th:text="${error}"></div>

  <!-- Solo el vocal logueado puede registrar; su grupo y nombre salen del login -->
  <div class="actions" th:if="${vocal != null}">
    <button class="btn in" hx-get="/registro/ingreso" hx-target="#modal-body" onclick="abrirModal()">+ Ingreso</button>
    <button class="btn out" hx-get="/registro/egreso" hx-target="#modal-body" onclick="abrirModal()">− Gasto / pago</button>
  </div>

  <!-- Cada pestaña pide su pedazo de HTML y lo pone en #panel -->
  <nav class="tabs" id="tabs" hx-target="#panel">
    <button th:classappend="${activeTab == 'resumen'} ? 'active'" hx-get="/resumen">Consulta</button>
    <!-- Movimientos solo para vocales logueados -->
    <button th:if="${vocal != null}" th:classappend="${activeTab == 'movimientos'} ? 'active'" hx-get="/movimientos?cancelados=true">Movimientos</button>
  </nav>

  <section id="panel" th:hx-get="${panelUrl}" hx-trigger="load"></section>

  <footer>Fondo de graduación</footer>
</div>

<!-- Modal para el formulario de ingreso -->
<div id="modal" class="modal" onclick="if(event.target===this) cerrarModal()">
  <div class="modal-content" id="modal-body"></div>
</div>

<!-- Modal de confirmación para borrar movimientos (Thymeleaf inserta el token CSRF en el form) -->
<div id="modal-borrar" class="modal" th:if="${vocal != null}" onclick="if(event.target===this) cerrarBorrar()">
  <div class="modal-content">
    <div class="card">
      <h2>¿Borrar este movimiento?</h2>
      <p class="meta" style="margin:-4px 0 12px">Se eliminará de la base de datos y no se puede recuperar.</p>
      <div id="borrar-desc" class="borrar-desc"></div>
      <form id="borrar-form" th:action="@{/registro/borrar/0}" method="post">
        <div class="form-actions">
          <button type="button" class="btn" onclick="cerrarBorrar()">Cancelar</button>
          <button class="btn out">Sí, borrar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Popup "Agregar nuevo concepto": se abre encima del formulario desde el combo de concepto.
     Se envía con fetch para no perder lo capturado; Thymeleaf mete el token CSRF en el form. -->
<div id="modal-concepto" class="modal modal-top" th:if="${vocal != null}" onclick="if(event.target===this) cerrarConcepto()">
  <div class="modal-content">
    <div class="card">
      <h2>Nuevo concepto</h2>
      <p class="meta" id="concepto-desc" style="margin:-4px 0 12px"></p>
      <form id="concepto-form" class="form" th:action="@{/registro/concepto}" method="post" onsubmit="guardarConcepto(event)">
        <input type="hidden" name="tipo">
        <input type="hidden" name="bolsa">
        <label class="field">Nombre del concepto
          <input name="nombre" required maxlength="150" autocomplete="off" placeholder="Ej. Compra de dulces">
        </label>
        <div id="concepto-error" class="alert error" hidden></div>
        <div class="form-actions">
          <button type="button" class="btn" onclick="cerrarConcepto()">Cancelar</button>
          <button class="btn primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Barra fija de totales: visible en todas las pestañas, se refresca cada minuto -->
<div class="totbar" hx-get="/totales" hx-trigger="load, every 60s"></div>

<script>
  document.querySelectorAll('#tabs button').forEach(b =>
    b.addEventListener('click', () =>
      document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b))));

  function abrirModal(){ document.getElementById('modal').classList.add('open'); }
  function cerrarModal(){
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-body').innerHTML = '';
  }
  function abrirBorrar(btn){
    document.getElementById('borrar-desc').textContent = btn.dataset.desc;
    document.getElementById('borrar-form').action = '/registro/borrar/' + btn.dataset.id;
    document.getElementById('modal-borrar').classList.add('open');
  }
  function cerrarBorrar(){ document.getElementById('modal-borrar').classList.remove('open'); }

  // Combo de concepto con la opción "Agregar nuevo concepto…"
  let comboConcepto = null;
  function conceptoCambio(sel){
    if (sel.value !== '__nuevo') return;
    sel.value = '';
    comboConcepto = sel;
    const f = document.getElementById('concepto-form');
    f.reset();
    f.tipo.value = sel.dataset.tipo;
    f.bolsa.value = sel.dataset.bolsa;
    document.getElementById('concepto-desc').textContent =
      (sel.dataset.tipo === 'INGRESO' ? 'Ingreso' : 'Gasto') + ' · ' + (sel.dataset.bolsa === 'EVENTO' ? 'Evento' : 'Alumno');
    document.getElementById('concepto-error').hidden = true;
    document.getElementById('modal-concepto').classList.add('open');
    setTimeout(() => f.nombre.focus(), 50);
  }
  async function guardarConcepto(e){
    e.preventDefault();
    const f = e.target, error = document.getElementById('concepto-error');
    const r = await fetch(f.action, { method: 'POST', body: new URLSearchParams(new FormData(f)) });
    const texto = await r.text();
    if (!r.ok) { error.textContent = texto; error.hidden = false; return; }
    // Si ya estaba en el combo solo se selecciona; si no, se agrega antes de "Agregar nuevo…"
    let opt = [...comboConcepto.options].find(o => o.value === texto);
    if (!opt) {
      opt = new Option(texto, texto);
      comboConcepto.insertBefore(opt, comboConcepto.querySelector('option[value="__nuevo"]'));
    }
    comboConcepto.value = texto;
    cerrarConcepto();
  }
  function cerrarConcepto(){ document.getElementById('modal-concepto').classList.remove('open'); }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    // Primero cierra el popup de concepto (está encima del formulario)
    const concepto = document.getElementById('modal-concepto');
    if (concepto && concepto.classList.contains('open')) { cerrarConcepto(); return; }
    cerrarModal(); cerrarBorrar();
  });
</script>
</body>
</html>
