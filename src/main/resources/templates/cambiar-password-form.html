<!-- Formulario para cambiar contraseña (pedazo que HTMX pone en #modal-body). -->
<div class="card">
  <h2>Cambiar contraseña</h2>
  <p class="meta" style="margin:-4px 0 12px" th:text="|${vocal.nombre} · usuario: ${vocal.usuario}|"></p>

  <form class="form" th:action="@{/registro/cambiar-password}" method="post">
    <label class="field">Contraseña actual
      <input name="actual" type="password" required autocomplete="current-password">
    </label>
    <label class="field">Nueva contraseña <span class="hint">(mínimo 6 caracteres)</span>
      <input name="nueva" type="password" required minlength="6" autocomplete="new-password">
    </label>
    <label class="field">Confirmar nueva contraseña
      <input name="confirmar" type="password" required minlength="6" autocomplete="new-password">
    </label>
    <div class="form-actions">
      <button type="button" class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary">Guardar</button>
    </div>
  </form>
</div>
