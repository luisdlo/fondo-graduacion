<!-- Formulario de gasto (pedazo que HTMX pone en #panel). Se envía normal y regresa a "/".
     Un fieldset por bolsa: el que no está elegido queda disabled y no se envía ni se valida. -->
<div class="card">
  <h2>Registrar gasto</h2>
  <p class="meta" style="margin:-4px 0 12px" th:text="|Registra ${vocal.nombre}|"></p>

  <form class="form" th:action="@{/egresos}" method="post" enctype="multipart/form-data">
    <p class="pick-label">¿De dónde sale el gasto?</p>
    <div class="bolsa-pick" role="radiogroup" aria-label="¿De dónde sale el gasto?"
         onchange="const ev = this.querySelector('input:checked').value === 'EVENTO';
                   const f = this.closest('form'); f.querySelector('#egr-grupo').disabled = f.querySelector('#egr-grupo').hidden = ev;
                   f.querySelector('#egr-evento').disabled = f.querySelector('#egr-evento').hidden = !ev;">
      <label class="bolsa-opt" th:style="|--acc:var(--g${vocal.grupoId})|">
        <input type="radio" name="bolsa" value="GRUPO" checked>
        <span class="bolsa-ico" aria-hidden="true">🎒</span>
        <span class="bolsa-txt"><strong>Alumno</strong><small th:text="${vocal.grupoNombre}">Grupo A</small></span>
      </label>
      <label class="bolsa-opt" style="--acc:var(--gE)">
        <input type="radio" name="bolsa" value="EVENTO">
        <span class="bolsa-ico" aria-hidden="true">🎉</span>
        <span class="bolsa-txt"><strong>Evento</strong></span>
      </label>
    </div>

    <fieldset id="egr-grupo" class="bolsa">
      <label class="field">Concepto
        <select name="concepto" required data-tipo="EGRESO" data-bolsa="GRUPO" onchange="conceptoCambio(this)">
          <option value="">— Elige el concepto —</option>
          <option th:each="c : ${conceptosGrupo}" th:value="${c}" th:text="${c}">Invitaciones</option>
          <option value="__nuevo">＋ Agregar nuevo concepto…</option>
        </select>
      </label>
    </fieldset>

    <fieldset id="egr-evento" class="bolsa" hidden disabled>
      <label class="field">Evento
        <select name="evento" required>
          <option value="">— Elige el evento —</option>
          <option th:each="e : ${eventos}" th:value="${e}" th:text="${e}">Halloween</option>
        </select>
      </label>
      <label class="field">Concepto
        <select name="concepto" required data-tipo="EGRESO" data-bolsa="EVENTO" onchange="conceptoCambio(this)">
          <option value="">— Elige el concepto —</option>
          <option th:each="c : ${conceptosEvento}" th:value="${c}" th:text="${c}">Compra de juguetes</option>
          <option value="__nuevo">＋ Agregar nuevo concepto…</option>
        </select>
      </label>
    </fieldset>

    <div class="grid2">
      <label class="field">Monto<input name="monto" type="number" min="1" step="0.01" inputmode="decimal" required></label>
      <label class="field">Fecha<input name="fecha" type="date" th:value="${hoy}" required></label>
    </div>
    <label class="field">Comprobante <span class="hint">(PDF o foto)</span>
      <input type="file" name="comprobante" accept="image/*,application/pdf">
    </label>
    <div class="form-actions">
      <button type="button" class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary">Guardar</button>
    </div>
  </form>
</div>
