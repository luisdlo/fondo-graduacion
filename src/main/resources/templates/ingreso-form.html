<!-- Formulario de ingreso (pedazo que HTMX pone en #panel). Se envía normal y regresa a "/".
     Un fieldset por bolsa: el que no está elegido queda disabled y no se envía ni se valida. -->
<div class="card">
  <h2>Registrar ingreso</h2>
  <p class="meta" style="margin:-4px 0 12px" th:text="|Registra ${vocal.nombre} · fecha de hoy|"></p>

  <form class="form" th:action="@{/ingresos}" method="post">
    <div class="radio-row"
         onchange="const ev = this.querySelector('input:checked').value === 'EVENTO';
                   const f = this.closest('form'); f.querySelector('#ing-grupo').disabled = f.querySelector('#ing-grupo').hidden = ev;
                   f.querySelector('#ing-evento').disabled = f.querySelector('#ing-evento').hidden = !ev;">
      <label><input type="radio" name="bolsa" value="GRUPO" checked> Aportación de alumno</label>
      <label><input type="radio" name="bolsa" value="EVENTO"> Evento</label>
    </div>

    <fieldset id="ing-grupo" class="bolsa">
      <p class="hint" th:text="|Se suma al ${vocal.grupoNombre}|"></p>
      <label class="field">Niño
        <select name="ninoId" required>
          <option value="">— Elige al niño —</option>
          <option th:each="n : ${ninos}" th:value="${n.id}" th:text="${n.nombre}">Niño</option>
        </select>
      </label>
      <label class="field">Concepto
        <select name="concepto" required>
          <option value="">— Elige el concepto —</option>
          <option th:each="c : ${conceptosGrupo}" th:value="${c}" th:text="${c}">Fondo de graduación</option>
        </select>
      </label>
    </fieldset>

    <fieldset id="ing-evento" class="bolsa" hidden disabled>
      <p class="hint">Se suma a la bolsa de Eventos (de los tres grupos)</p>
      <label class="field">Evento
        <select name="evento" required>
          <option value="">— Elige el evento —</option>
          <option th:each="e : ${eventos}" th:value="${e}" th:text="${e}">Halloween</option>
        </select>
      </label>
      <label class="field">Concepto
        <select name="concepto" required>
          <option value="">— Elige el concepto —</option>
          <option th:each="c : ${conceptosEvento}" th:value="${c}" th:text="${c}">Venta de juguetes</option>
        </select>
      </label>
    </fieldset>

    <label class="field">Monto
      <select name="monto"
              onchange="const otro = this.form.otroMonto; otro.hidden = this.value !== ''; otro.required = this.value === ''; if (!otro.hidden) otro.focus();">
        <option th:each="m : ${montos}" th:value="${m}" th:text="${'$' + #numbers.formatDecimal(m, 1, 'COMMA', 0, 'POINT')}">$500</option>
        <option value="">Otra cantidad…</option>
      </select>
      <input name="otroMonto" type="number" min="1" step="0.01" placeholder="Escribe la cantidad" hidden>
    </label>
    <div class="form-actions">
      <button type="button" class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary">Guardar</button>
    </div>
  </form>
</div>
