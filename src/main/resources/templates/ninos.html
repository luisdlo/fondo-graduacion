<!-- Pestaña Por niño (pedazo que HTMX pone en #panel) -->
<div class="chips" hx-target="#panel">
  <button th:each="g : ${grupos}" th:attr="hx-get=@{/ninos(grupo=${g.id})}"
          th:classappend="${g.id == grupo} ? 'active'" th:text="${g.nombre}">Grupo A</button>
</div>

<div class="card">
  <h2>Aportaciones por niño · Fondo de graduación</h2>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Niño</th><th>Pagos</th><th>Total aportado</th></tr></thead>
      <tbody>
        <tr th:each="n : ${ninos}">
          <td th:text="${n.nombre}">Niño</td>
          <td th:text="${n.pagos > 0 ? n.pagos : '—'}">0</td>
          <td><strong><span th:replace="~{fragments :: money(${n.total})}"></span></strong></td>
        </tr>
        <tr th:if="${ninos.isEmpty()}"><td colspan="3" class="muted">Sin niños registrados en este grupo.</td></tr>
      </tbody>
    </table>
  </div>
</div>
